<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII.FX</title>
<style>
:root {
  --bg: #0d0d0d;
  --panel: #111;
  --border: #1f1f1f;
  --text: #e0e0e0;
  --muted: #555;
  --accent: #17CFB9;
  --track: #1f1f1f;
  --font: 'Courier New', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: var(--font);
  color: var(--text);
}

/* ── Full-bleed canvas ── */
#c {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  display: block;
  background: transparent;
}

/* ── Floating toolbar ── */
#toolbar {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 1px;
  background: var(--panel);
  border: 1px solid var(--border);
}

.tb-btn {
  height: 34px;
  padding: 0 16px;
  background: transparent;
  border: none;
  border-right: 1px solid var(--border);
  color: var(--muted);
  font-family: var(--font);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: color 0.1s, background 0.1s;
}
.tb-btn:last-child { border-right: none; }
.tb-btn:hover { color: var(--accent); background: rgba(200,255,0,0.04); }

/* colour swatch dot */
#color-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #17CFB9;
  flex-shrink: 0;
  pointer-events: none;
}


/* colour input overlays button — invisible but clickable */
#char-color {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
  border: none;
  padding: 0;
}

/* ── Speed slider ── */
#speed-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 34px;
  padding: 0 16px;
  border-right: 1px solid var(--border);
  color: var(--muted);
  font-family: var(--font);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  white-space: nowrap;
}
#speed-wrap:last-child { border-right: none; }
#intro-speed {
  -webkit-appearance: none;
  appearance: none;
  width: 80px;
  height: 2px;
  background: var(--border);
  outline: none;
  cursor: pointer;
}
#intro-speed::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}
#intro-speed::-moz-range-thumb {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: none;
}
#speed-val {
  color: var(--accent);
  min-width: 2ch;
}

/* ── Empty state ── */
#hint {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  pointer-events: none;
}
#hint h1 {
  font-size: clamp(28px, 4vw, 56px);
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1.1;
  text-align: center;
}
#hint h1 span { color: var(--accent); }
#hint p {
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--muted);
  text-transform: uppercase;
}

</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hint">
  <h1>ASCII.<br><span>watch it scatter.</span></h1>
</div>

<div id="toolbar">
  <button class="tb-btn" id="refresh-btn">↺ replay</button>
  <button class="tb-btn" id="save-btn">↓ save png</button>
  <button class="tb-btn" id="color-btn" style="position:relative;overflow:hidden;">
    <span id="color-dot"></span>colour
    <input type="color" id="char-color" value="#17CFB9" title="">
  </button>
</div>

<script>
const hint      = document.getElementById('hint');
const canvas    = document.getElementById('c');
const ctx       = canvas.getContext('2d');
const colorBtn  = document.getElementById('color-btn');
const colorDot  = document.getElementById('color-dot');
const colorInput= document.getElementById('char-color');

// All settings — preserved from sidebar version
const S = {
  brightness:   0,
  contrast:     0,
  threshold:    0,
  charColor:    '#17CFB9',
  fontSize:     9,
  charset:      'dense',
  mouseRadius:  85,
  mouseForce:   10,
  scrollForce:  16,
  scrollSpread: 12,
  returnSpeed:  8,
  damping:      0.80,
  hoverAmp:     0.8,   // max pixel drift
  hoverSpeed:   0.8,   // relative speed multiplier
};

const CHARSETS = {
  dense:  ' .:-=+*#%@',
  block:  ' ░▒▓█',
  alpha:  ' abcdefghijklmnopqrstuvwxyz',
  binary: ' 01',
  minimal:' .:·'
};

// ── Colour picker ──────────────────────────────────────────────────────────
colorInput.addEventListener('input', e => {
  S.charColor = e.target.value;
  colorDot.style.background = S.charColor;
});

// ── Replay button ──────────────────────────────────────────────────────────
document.getElementById('refresh-btn').addEventListener('click', () => {
  if (rawImg) buildParticles(rawImg);
});

// ── Save PNG ───────────────────────────────────────────────────────────────
document.getElementById('save-btn').addEventListener('click', () => {
  if (!particles.length) return;

  const SCALE = 4;
  const w = canvas.width;
  const h = canvas.height;

  const off = document.createElement('canvas');
  off.width  = w * SCALE;
  off.height = h * SCALE;
  const oc = off.getContext('2d', { alpha: true });

  oc.clearRect(0, 0, off.width, off.height);

  const fs = S.fontSize * SCALE;
  oc.font = fs + "px 'Courier New',monospace";
  oc.fillStyle = S.charColor;
  oc.textBaseline = 'alphabetic';

  for (const p of particles) {
    if (p.opacity < 0.05) continue;
    oc.globalAlpha = p.opacity;
    oc.fillText(p.char, p.homeX * SCALE, p.homeY * SCALE);
  }
  oc.globalAlpha = 1;

  // Use toDataURL — more reliable cross-browser than toBlob for download
  const dataURL = off.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = dataURL;
  a.download = 'ascii-art.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

document.addEventListener('click', e => {
});


let rawImg = null;

// ── Particle system ────────────────────────────────────────────────────────
let particles = [];
let animId    = null;
let mouseX = -9999, mouseY = -9999;
let canvasRect = null;
let scrollVel  = 0, scrollDecayTimer = null;
let mouseActive = false, mouseIdleTimer = null;
let t = 0;
let introProgress = 0; // 0→1 over intro duration
let INTRO_DURATION = 4.5; // seconds

function applyAdjustments(r, g, b) {
  const br = S.brightness;
  const factor = (259 * (S.contrast + 255)) / (255 * (259 - S.contrast));
  r = Math.max(0, Math.min(255, factor * (r - 128) + 128 + br));
  g = Math.max(0, Math.min(255, factor * (g - 128) + 128 + br));
  b = Math.max(0, Math.min(255, factor * (b - 128) + 128 + br));
  return [r, g, b];
}

function buildParticles(img) {
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  particles = [];

  const areaW = window.innerWidth;
  const areaH = window.innerHeight;

  canvas.width  = areaW;
  canvas.height = areaH;

  // Letterbox image into full viewport
  const imgAspect  = img.width / img.height;
  const areaAspect = areaW / areaH;
  let dw, dh, dx, dy;
  if (imgAspect > areaAspect) {
    dw = areaW; dh = areaW / imgAspect;
    dx = 0;     dy = (areaH - dh) / 2;
  } else {
    dh = areaH; dw = areaH * imgAspect;
    dy = 0;     dx = (areaW - dw) / 2;
  }

  const off = document.createElement('canvas');
  off.width = areaW; off.height = areaH;
  const oc = off.getContext('2d');
  oc.drawImage(img, dx, dy, dw, dh);
  const imgData = oc.getImageData(0, 0, areaW, areaH);
  const data    = imgData.data;

  const res   = S.fontSize;
  const chars = CHARSETS[S.charset] || CHARSETS.dense;

  for (let y = res; y < areaH; y += res) {
    for (let x = 0; x < areaW; x += res) {
      const i = (y * areaW + x) * 4;
      const alpha = data[i + 3];
      if (alpha < 30) continue;

      let [r, g, b] = applyAdjustments(data[i], data[i+1], data[i+2]);
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

      if (S.threshold > 0 && lum * 255 < S.threshold) continue;

      const ci   = Math.min(Math.floor(lum * (chars.length - 1)), chars.length - 1);
      const char = chars[ci] === ' ' ? (chars[ci + 1] || '.') : chars[ci];
      if (!char || char === ' ') continue;

      // scatter start position: random direction, pulled inward
      const angle = Math.random() * Math.PI * 2;
      const dist  = 120 + Math.random() * 180;
      const sx    = x + Math.cos(angle) * dist;
      const sy    = y + Math.sin(angle) * dist;
      const delay = Math.random() * 0.5; // stagger 0–0.5s

      particles.push({
        x: sx, y: sy,
        homeX: x, homeY: y,
        vx: 0, vy: 0,
        char,
        opacity: alpha / 255,
        phase: Math.random() * Math.PI * 2,
        phaseSpeed: 0.004 + Math.random() * 0.004,
        sx, sy,        // scatter origin
        introDelay: delay,
      });
    }
  }

  hint.style.display = 'none';
  introProgress = 0;

  requestAnimationFrame(() => {
    canvasRect = canvas.getBoundingClientRect();
    animId = requestAnimationFrame(animate);
  });
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const lx  = mouseX - canvasRect.left;
  const ly  = mouseY - canvasRect.top;
  const r   = S.mouseRadius;
  const rx  = r * 0.7;  // narrower horizontally
  const ry  = r * 0.96;  // taller vertically, 40% shorter than before
  const mf  = S.mouseForce;
  const rs  = (S.returnSpeed / 1000) * 10;
  const dm  = S.damping;
  const sf  = S.scrollForce;
  const ss  = S.scrollSpread;
  const col = S.charColor;
  const fsize = S.fontSize;

  ctx.font = fsize + "px 'Courier New',monospace";
  ctx.fillStyle = col;
  t += 0.016;

  // Advance intro (uses real delta via t increment ~60fps)
  if (introProgress < 1) introProgress = Math.min(1, introProgress + 0.016 / INTRO_DURATION);

  for (const p of particles) {
    // ── Intro: override position/opacity until intro done ──
    if (introProgress < 1) {
      const delayed = Math.max(0, introProgress - p.introDelay / INTRO_DURATION);
      const ease = delayed < 1 ? 1 - Math.pow(1 - delayed, 3) : 1; // ease-out cubic
      p.x  = p.sx  + (p.homeX - p.sx)  * ease;
      p.y  = p.sy  + (p.homeY - p.sy)  * ease;
      p.vx = 0; p.vy = 0;
      const hoverX = p.x + Math.sin(t * p.phaseSpeed * 60 * S.hoverSpeed + p.phase) * S.hoverAmp;
      const hoverY = p.y + Math.sin(t * p.phaseSpeed * 60 * S.hoverSpeed + p.phase + 1.2) * S.hoverAmp * 1.3;
      ctx.globalAlpha = p.opacity * ease;
      ctx.fillText(p.char, hoverX, hoverY);
      continue;
    }
    if (mouseActive) {
      const dx = lx - p.x, dy = ly - p.y;
      const ellipse = (dx * dx) / (rx * rx) + (dy * dy) / (ry * ry);
      if (ellipse < 1 && ellipse > 0.0001) {
        const d = Math.sqrt(dx * dx + dy * dy);
        const force = (1 - ellipse) * mf;
        p.vx -= (dx / d) * force;
        p.vy -= (dy / d) * force;
      }
    }

    if (scrollVel !== 0) {
      p.vx += (Math.random() - 0.5) * Math.abs(scrollVel) * ss;
      p.vy += scrollVel * sf * 0.25 + (Math.random() - 0.5) * Math.abs(scrollVel) * sf * 0.1;
    }

    p.vx += (p.homeX - p.x) * rs;
    p.vy += (p.homeY - p.y) * rs;
    p.vx *= dm;
    p.vy *= dm;
    p.x += p.vx;
    p.y += p.vy;

    const hoverX = p.x + Math.sin(t * p.phaseSpeed * 60 * S.hoverSpeed + p.phase) * S.hoverAmp;
    const hoverY = p.y + Math.sin(t * p.phaseSpeed * 60 * S.hoverSpeed + p.phase + 1.2) * S.hoverAmp * 1.3;
    ctx.globalAlpha = p.opacity;
    ctx.fillText(p.char, hoverX, hoverY);
  }

  ctx.globalAlpha = 1;
  animId = requestAnimationFrame(animate);
}

// ── Events ─────────────────────────────────────────────────────────────────
window.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  mouseActive = true;
  clearTimeout(mouseIdleTimer);
  mouseIdleTimer = setTimeout(() => { mouseActive = false; }, 800);
});
window.addEventListener('mouseleave', () => {
  mouseX = -9999; mouseY = -9999; mouseActive = false;
});
window.addEventListener('wheel', e => {
  scrollVel = e.deltaY * 0.12;
  clearTimeout(scrollDecayTimer);
  scrollDecayTimer = setTimeout(() => { scrollVel = 0; }, 150);
}, { passive: true });
window.addEventListener('resize', () => {
  if (rawImg) buildParticles(rawImg);
});

// Auto-load bundled image on start — treat black (#000) as transparent
(function() {
  const img = new Image();
  img.onload = function() {
    // Re-draw onto offscreen canvas, punching out black pixels
    const off = document.createElement('canvas');
    off.width = img.width; off.height = img.height;
    const oc = off.getContext('2d');
    oc.drawImage(img, 0, 0);
    const id = oc.getImageData(0, 0, off.width, off.height);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i+1], b = d[i+2];
      // treat near-black as transparent
      if (r < 30 && g < 30 && b < 30) d[i+3] = 0;
    }
    oc.putImageData(id, 0, 0);
    // create a new image from the punched canvas
    const img2 = new Image();
    img2.onload = function() { rawImg = img2; buildParticles(img2); };
    img2.src = off.toDataURL();
  };
